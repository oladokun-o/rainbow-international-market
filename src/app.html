<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1E6B3F" />

    <!-- Favicon is linked from src/routes/+layout.svelte (hashed asset import).
         A real brand favicon set drops in here once client assets arrive. -->
    <link
      rel="preload"
      as="image"
      href="%sveltekit.assets%/brand/logo-horizontal-green.svg"
      fetchpriority="high"
    />

    <!--
      SEO / Open Graph / Twitter meta will be rendered per-page by a <Seo>
      component (added in a later phase).
    -->
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
